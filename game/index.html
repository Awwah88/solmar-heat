<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Heat — an open-world crime game in Solmar Bay. Steal cars, outrun the police and finish Dana Reyes's three missions.">
<title>Solmar Heat — Open-World Crime in Solmar Bay</title>
<style>
  /* Page frame: the canvas fills the window; the HUD floats above it. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151f; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud button { pointer-events: auto; }
  #loadError { display: none; position: fixed; inset: auto 0 0 0; background: #a33; color: #fff; padding: 12px; font-size: 14px; z-index: 20; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Top bar: money, health, wanted stars. */
  #topbar { position: absolute; top: 12px; left: 14px; display: flex; align-items: center; gap: 14px; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  #money { font-size: 28px; font-weight: bold; color: #7dff9e; }
  #healthWrap { width: 150px; height: 16px; background: rgba(0,0,0,.55); border: 1px solid #ffffff66; border-radius: 8px; position: relative; overflow: hidden; }
  #healthBar { height: 100%; width: 100%; background: #37b268; }
  #healthText { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; font-weight: bold; }
  #wanted { font-size: 24px; letter-spacing: 3px; }

  /* Mission panel, toast, speedometer and hint line. */
  #missionPanel { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 10px; max-width: 520px; }
  #missionTitle { font-weight: bold; font-size: 15px; color: #ffd23b; }
  #missionBrief { font-size: 13px; color: #eee; }
  #missionTimer { font-size: 15px; font-weight: bold; color: #ff9a3b; }
  #toast { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65); padding: 8px 18px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity .3s; text-align: center; max-width: 560px; }
  #speedo { position: absolute; right: 18px; bottom: 222px; font-size: 26px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  #hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #ffffffcc; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 200px; height: 200px; border: 2px solid #ffffff55; border-radius: 8px; background: #10151f; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; color: #ffffffcc; display: none; text-shadow: 0 1px 2px #000; }
  #damageFlash { position: absolute; inset: 0; background: #d23b3b; opacity: 0; transition: opacity .15s; pointer-events: none; }

  /* Full-screen menus: title, pause and end screens. */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,16,30,.82), rgba(60,20,10,.78)); pointer-events: auto; text-align: center; padding: 24px; }
  .overlay h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffd23b; text-shadow: 0 4px 0 #a33d00, 0 8px 24px rgba(0,0,0,.7); }
  .overlay .sub { font-size: 18px; color: #ffe9a8; margin: 6px 0 18px; }
  .overlay .story { max-width: 620px; font-size: 15px; line-height: 1.55; color: #f2f2f2; }
  .overlay button { pointer-events: auto; margin: 6px; padding: 12px 26px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; background: #ffd23b; color: #201400; cursor: pointer; }
  .overlay button:hover { background: #ffe08a; }
  .overlay .fine { max-width: 560px; font-size: 12px; color: #ffffff99; margin-top: 18px; }
  #controlsList { background: rgba(0,0,0,.55); border-radius: 10px; padding: 12px 18px; margin-top: 10px; text-align: left; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<!-- The 3D view. The HUD is built into #hud by hud.js at startup. -->
<canvas id="game" aria-label="Solmar Heat: an open-world crime game in Solmar Bay. Drive, steal cars, outrun the police and finish Dana Reyes's three missions."></canvas>
<div id="hud"></div>
<div id="loadError" role="alert"></div>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;padding:24px">Solmar Heat needs JavaScript to run.</p></noscript>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
