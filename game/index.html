<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<meta name="description" content="Solmar Heat: a 3D open-world crime game in Solmar Bay. Steal cars, lose the heat, pay the Marlin Club. Built for make.fun's Make GTA 6 bounty.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1b26;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #gl { position: fixed; inset: 0; display: block; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    background: #0d1b26;
    z-index: 5;
    pointer-events: none;
  }
  #loading h1 {
    margin: 0;
    font-size: 44px;
    letter-spacing: 3px;
    color: #ff7a3c;
    text-shadow: 3px 3px 0 #7a1e00;
  }
  #loading p { margin: 8px 0 0; color: #e8c832; font-size: 16px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="loading">
  <h1>SOLMAR HEAT</h1>
  <p>Loading Solmar Bay…</p>
</div>
<p id="status" role="status" aria-live="polite">Solmar Heat is loading.</p>
<script type="module">
  // Hide the loading screen once the game module has run; the game
  // itself appends its canvas and HUD on top of this page.
  import './src/main.js';
  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
  const status = document.getElementById('status');
  if (status) status.textContent = 'Solmar Heat loaded. Press Start Story to play.';
</script>
</body>
</html>
