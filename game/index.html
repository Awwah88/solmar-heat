<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c1420; font-family: "Segoe UI", Verdana, sans-serif; }
  #app { position: fixed; inset: 0; }
  #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud-root { position: absolute; inset: 0; pointer-events: none; color: #fff; }
  #err { position: absolute; left: 8px; bottom: 8px; max-width: 70%; color: #ff9a9a; font: 12px monospace; white-space: pre-wrap; pointer-events: none; z-index: 60; }
  .panel { background: rgba(8, 16, 28, 0.72); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; }
  #topbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center; }
  .chip { padding: 6px 12px; font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
  #money-chip { color: #7dff9a; }
  #health-wrap { width: 150px; height: 18px; padding: 0; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #37d67a, #a5e635); transition: width 0.2s; }
  #stars-chip { color: #ffd23e; letter-spacing: 2px; font-size: 17px; }
  #objective { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: 46%; padding: 8px 14px; font-size: 14px; text-align: center; }
  #objective b { color: #ffd23e; }
  #minimap { position: absolute; right: 10px; top: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(8,16,28,0.8); }
  #toast { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #hint { position: absolute; bottom: 10px; left: 10px; padding: 6px 10px; font-size: 12px; color: #cfe3ff; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 38%, rgba(10,24,44,0.55), rgba(4,8,16,0.88)); pointer-events: auto; text-align: center; }
  .screen h1 { margin: 0; font-size: 56px; letter-spacing: 4px; color: #ffd23e; text-shadow: 0 3px 0 #7a2e00, 0 8px 24px rgba(0,0,0,0.7); }
  .screen h2 { margin: 0; font-size: 20px; font-weight: 400; color: #eaf3ff; }
  .screen p { margin: 0; max-width: 560px; font-size: 14px; line-height: 1.5; color: #cfe3ff; }
  .screen button { pointer-events: auto; cursor: pointer; font-size: 18px; font-weight: 700; padding: 12px 34px; border-radius: 10px; border: 2px solid #ffd23e; background: #ffb703; color: #241300; }
  .screen button:hover { background: #ffd23e; }
  .screen button.ghost { background: transparent; color: #eaf3ff; border-color: rgba(255,255,255,0.5); }
  .screen .keys { font-size: 13px; color: #9fb8d8; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="hud-root"></div>
  <div id="err"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
